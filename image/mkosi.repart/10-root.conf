# Read-only, verity-protected root filesystem. erofs is read-only by
# construction and reproducible-friendly.
[Partition]
Type=root
Format=erofs
CopyFiles=/
# These live in their own partitions (ESP, var); keep the measured rootfs
# free of them.
ExcludeFiles=/boot
ExcludeFiles=/efi
ExcludeFiles=/var
Verity=data
VerityMatchKey=root
Minimize=best
