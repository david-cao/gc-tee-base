# gc-tee-base measured Confidential VM image.
#
# Shape: UKI (systemd-stub: kernel + initrd + cmdline) at EFI/BOOT/BOOTX64.EFI
# measured into PCR 4 (firmware) and PCR 11 (stub); dm-verity root hash
# auto-appended to the UKI cmdline binds the read-only rootfs (launcher,
# containerd, systemd) to those PCRs. /var is a separate writable partition
# outside the measurement (workload integrity is anchored separately, by the
# launcher's PCR 13 image-digest measurement).
#
# Build with deploy/build-image.sh (mkosi needs Linux). Profiles:
#   --profile dev   serial-console autologin + tpm2-tools, for calibration
#   --profile prod  no login path

[Distribution]
Distribution=ubuntu
Release=noble
Repositories=main,universe

[Output]
Format=disk
ImageId=gc-tee-base
# Emit the UKI and the verity roothash next to the disk image;
# build-image.sh feeds them to predict-measurements. (No `pcrs` artifact:
# that would require systemd-measure >= 258 on the builder — Ubuntu 24.04 has
# 255 — and our predict-measurements tool computes PCR 11 from the UKI
# itself; the real check is the calibration boot.)
SplitArtifacts=uki,roothash

[Validation]
# Verity hash partition for the root filesystem (no signature partition:
# measured boot only, the verifier pins PCRs instead of secure boot).
Verity=hash

[Content]
Bootable=yes
Bootloader=uki
UnifiedKernelImages=unsigned
# console for debugging via GCE serial port; roothash= is appended
# automatically by mkosi/systemd-repart.
KernelCommandLine=console=ttyS0,115200n8
Packages=systemd,
         systemd-sysv,
         systemd-boot-efi,
         udev,
         dbus,
         linux-image-gcp,
         containerd,
         ca-certificates,
         systemd-timesyncd,
         systemd-resolved,
         iproute2
CleanPackageMetadata=yes
